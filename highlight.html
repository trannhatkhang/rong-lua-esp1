<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight & Khoảnh Khắc - RỒNG LỬA ESP</title>
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --------------------------------------------------
           VIỀN WEB HIỆU ỨNG RỒNG LỬA (NEON FIRE BORDER)
        -------------------------------------------------- */
        .fire-border-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            padding: 5px; /* Độ dày của viền */
            border-radius: 16px;
            /* Dãy màu hiệu ứng Lửa: Đỏ, Cam, Vàng */
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #ff0000);
            background-size: 400% 400%;
            animation: fireGlow 6s ease infinite;
            /* Đổ bóng phát sáng xung quanh web */
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.6),
                        0 0 40px rgba(255, 140, 0, 0.4);
        }

        /* Hiệu ứng di chuyển luồng lửa */
        @keyframes fireGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Khung nội dung bên trong viền */
        .main-content {
            background-color: #121212;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
        }

        /* Header & Tiêu đề */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ff4500;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 69, 0, 0.5);
        }

        /* Nút quay về trang chủ */
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
        }

        /* Khung lưới chứa Video Highlight */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-card {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #333;
        }

        .video-card h3 {
            color: #ff8c00;
            margin-bottom: 10px;
        }

        /* Responsive iframe cho video YouTube hoặc file MP4 */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Tỷ lệ 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
        }

        .video-wrapper iframe, .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="fire-border-container">
        
        <div class="main-content">
            <a href="index.html" class="btn-back">⬅ Quay về Trang Chủ</a>
            
            <header>
                <h1>🔥 HIGHLIGHT & KHOẢNH KHẮC 🔥</h1>
                <p>Tổng hợp những pha xử lý đỉnh cao của RỒNG LỬA ESP</p>
            </header>

            <div class="video-grid">
                
                <div class="video-card">
                    <h3>Pha Clutch 1v4 Cực Căng - KAWM</h3>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                    </div>
                </div>

                <div class="video-card">
                    <h3>Highlight Trận Chung Kết FFSL</h3>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                    </div>
                </div>

            </div>
        </div>

    </div>

</body>
</html>
