<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Matches - RỒNG LỬA ESP</title>

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Be Vietnam Pro', sans-serif; }
        body { background: #090909; color: #fff; }
        h1, h2, .logo, nav a { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        nav {
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background: rgba(17, 17, 17, 0.95);
            border-bottom: 2px solid #ff2d2d;
        }
        .logo { font-size: 28px; font-weight: 700; color: #ff3b3b; }
        nav ul { display: flex; gap: 25px; list-style: none; }
        nav a { color: white; text-decoration: none; font-size: 1.1rem; }
        nav a:hover, nav a.active { color: #ff2d2d; }

        section { padding: 50px 8%; }
        .title { text-align: center; font-size: 2.8rem; margin-bottom: 30px; color: #ff4040; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .video-card {
            background: #141414;
            border: 2px solid #ff2d2d;
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 0 15px rgba(255, 45, 45, 0.2);
            transition: transform 0.3s;
        }
        .video-card:hover { transform: translateY(-8px); box-shadow: 0 0 25px rgba(255, 87, 34, 0.8); }
        .video-card iframe { width: 100%; height: 530px; border: none; display: block; }

        footer { background: #111; padding: 30px; text-align: center; border-top: 2px solid #ff2d2d; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">RỒNG LỬA ESP</div>
        <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="highlight.html" class="active">Highlight</a></li>
            <li><a href="thanh_tich.html">Thành Tích</a></li>
        </ul>
    </nav>

    <section>
        <h2 class="title">🔥 YOUTUBE HIGHLIGHTS</h2>
        <div class="video-grid">
            <!-- Video 1 -->
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/qhZyCgJWkD4" allowfullscreen></iframe>
            </div>
            <!-- Video 2 -->
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/6N8yvstoKJ0" allowfullscreen></iframe>
            </div>
            
            <!-- Video 3 (Đã được sửa lại URL chuẩn Embed) -->
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/VpajdWgxa80" allowfullscreen></iframe>
            </div>
        </div>
    </section>

    <footer>© 2026 RỒNG LỬA ESP. All Rights Reserved.</footer>
</body>
</html>
